# nixpacks.toml

[build]
# Указываем, что Nix будет использоваться пакетным менеджером.
providers = ["nix"]

# Явно указываем репозиторий Nixpkgs.
# Это позволяет нам выбрать конкретную версию Nixpkgs, которая
# гарантированно содержит Node.js v20.
# Используем актуальную стабильную ветку `nixos-23.05` или `nixos-23.11`.
# Если возникнут проблемы, возможно, потребуется использовать `nixos-unstable`
# или найти конкретный коммит Nixpkgs, который гарантирует Node.js 20.
pkgsArchive = "https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-23.05.tar.gz" # Попробуйте сначала эту ветку

# Описываем Nix-окружение, которое будет создано.
[nix.expression]
render = """
let
  # Импортируем Nixpkgs из указанного архива.
  pkgs = import pkgsArchive {};

  # Определяем пакет Node.js v20. Он включает npm, npx.
  # Если команда `pkgs.nodejs_20` не найдена, попробуйте `pkgs.nodejs.v20_2.full`
  # или проверьте доступные пакеты в выбранной версии Nixpkgs.
  nodejsEnv = pkgs.nodejs_20; # Убедитесь, что это корректное имя пакета в вашу версию nixpkgs

  # Пакет Chromium.
  chromiumPkg = pkgs.chromium;

in
# Создаем "оболочку" (shell) для нашего приложения.
# Это окружение, в котором будут выполняться команды сборки и запуска.
pkgs.mkShell {
  # Список системных пакетов, которые будут доступны.
  packages = [
    nodejsEnv      # Добавляет node, npm, npx из v20 в PATH
    chromiumPkg    # Делает команду chromium доступной

    # Системные библиотеки, которые часто нужны для рендеринга в Chromium.
    # Даже если они включены в пакет chromium, явное указание повышает надежность.
    pkgs.libgbm
    pkgs.freetype
    pkgs.pango
    pkgs.libcups
    pkgs.libXrender
    pkgs.libXext
    pkgs.glibc
    pkgs.libnotify
  ];

  # shellHook выполняется один раз при создании Nix-окружения.
  # Здесь мы устанавливаем все критически важные переменные окружения.
  shellHook = ''
    echo "--- Nix Environment Setup ---"
    echo "Nixpkgs source: ${pkgsArchive}"
    # Используем явные пути к исполнимым файлам из Nix-store для большей надежности
    echo "Node.js version via Nix path: $($pkgs.nodejs_20/bin/node --version)"
    echo "npm version via Nix path:     $(/nix/store/*/bin/npm --version)" # npm обычно в корне Nix-store/bin
    echo "Chromium path (Nix):          ${pkgs.chromium}/bin/chromium"
    echo "---------------------------"

    # Экспортируем переменные окружения, которые Puppeteer ищет.
    export CHROMIUM_PATH="${pkgs.chromium}/bin/chromium"
    export PUPPETEER_EXECUTABLE_PATH="${pkgs.chromium}/bin/chromium" # Puppeteer часто ищет и эту переменную

    # Добавляем директории с исполняемыми файлами Node.js v20 и npm в PATH.
    # Это гарантирует, что команды `node` и `npm` будут ссылаться на нужные версии.
    export PATH="${pkgs.nodejs_20.bin}:$PATH"
    export PATH="${pkgs.npm}/bin:$PATH" # Явно добавляем npm, даже если он в nodejsEnv

    # Проверка PATH после изменений
    echo "Node.js in PATH: $(which node)"
    echo "npm in PATH: $(which npm)"
  '';
}
"""

# --- Команды для сборки и запуска ---

# Команда для установки зависимостей проекта (выполняется до startCommand).
# `npm ci` предпочтительнее для CI/CD, так как он быстрее и надежнее `npm install`.
installCommand = "npm ci";

# Команда для запуска вашего приложения.
# Она будет выполнена внутри Nix-окружения, настроенного выше.
startCommand = """
echo "--- Application Startup ---"
# Проверяем версии Node.js, npm и путь к Chromium, как их видит приложение.
echo "Using Node.js version: $(node --version)"
echo "Using npm version: $(npm --version)"
echo "Chromium path environment var: ${CHROMIUM_PATH}"
echo "Node executable path: $(which node)"
echo "---------------------------"

# Запускаем основной файл вашего приложения.
# Убедитесь, что 'server/index.js' - это правильный путь к вашему стартовому файлу.
# Если ваш стартовый файл называется иначе или находится в другой папке, измените его.
node server/index.js
"""
