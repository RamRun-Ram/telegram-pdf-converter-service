# nixpacks.toml

[build]
# Указываем, что Nix будет использоваться пакетным менеджером.
providers = ["nix"]

# Явно указываем репозиторий Nixpkgs.
# Используем актуальную стабильную ветку `nixos-23.05`.
# Если возникнут проблемы, попробуйте `nixos-23.11` или `nixos-unstable`.
pkgsArchive = "https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-23.05.tar.gz"

# Описываем Nix-окружение, которое будет создано.
[nix.expression]
render = """
let
  # Импортируем Nixpkgs из указанного архива.
  pkgs = import pkgsArchive {};

  # Определяем пакет Node.js v20. Убедитесь, что `pkgs.nodejs_20` существует в выбранной версии Nixpkgs.
  # Если нет, попробуйте `pkgs.nodejs.v20_2.full` или другое актуальное имя.
  nodejsEnv = pkgs.nodejs_20;

  # Определение пакета Chromium.
  chromiumPkg = pkgs.chromium;

in
# Создаем "оболочку" (shell) для нашего приложения.
pkgs.mkShell {
  # Список системных пакетов, которые будут доступны.
  packages = [
    nodejsEnv      # Делает `node`, `npm`, `npx` доступными из Node.js 20
    chromiumPkg    # Делает команду `chromium` доступной

    # Системные библиотеки, часто необходимые для Chromium.
    pkgs.libgbm
    pkgs.freetype
    pkgs.pango
    pkgs.libcups
    pkgs.libXrender
    pkgs.libXext
    pkgs.glibc
    pkgs.libnotify
  ];

  # shellHook выполняется один раз при создании Nix-окружения.
  # Здесь мы устанавливаем переменные окружения.
  shellHook = ''
    echo "--- Nix Environment Setup ---"
    echo "Nixpkgs source: ${pkgsArchive}"
    
    # Надежный способ проверить доступность `node` и `npm` после установки PATH.
    # Вместо сложного `$($pkgs.nodejs_20/bin/node ...)` используется `$(which node)`.
    echo "Node.js executable found via 'which': $(which node)"
    echo "npm executable found via 'which':     $(which npm)"
    
    # Явно отображаем путь к Chromium, как его видит Nix.
    echo "Chromium path (Nix):          ${chromiumPkg}/bin/chromium"
    echo "---------------------------"

    # Экспортируем переменные окружения, которые Puppeteer ищет.
    # Nix уже раскрывает ${chromiumPkg} здесь.
    export CHROMIUM_PATH="${chromiumPkg}/bin/chromium"
    export PUPPETEER_EXECUTABLE_PATH="${chromiumPkg}/bin/chromium" # Puppeteer часто ищет эту переменную

    # Добавляем директории с исполняемыми файлами Node.js v20 и npm в PATH.
    # Nix раскрывает `${nodejsEnv.bin}` и `${pkgs.npm.bin}` здесь.
    export PATH="${nodejsEnv.bin}:$PATH"
    export PATH="${pkgs.npm.bin}:$PATH" # Явно добавляем npm, если он не в nodejsEnv

    echo "PATH adjusted. Current node: $(which node), npm: $(which npm)"
  '';
}
"""

# Команда для установки зависимостей проекта (выполняется до startCommand).
installCommand = "npm ci";

# Команда для запуска вашего приложения.
# Она будет выполнена внутри Nix-окружения, настроенного выше.
startCommand = """
echo "--- Application Startup ---"
echo "Using Node.js version: $(node --version)"
echo "Using npm version: $(npm --version)"
echo "Chromium path environment var: ${CHROMIUM_PATH}"
echo "Node executable path: $(which node)"
echo "---------------------------"

# Запускаем основной файл вашего приложения.
# Убедитесь, что 'server/index.js' - это правильный путь к вашему стартовому файлу.
node server/index.js
"""