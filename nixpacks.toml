# nixpacks.toml

[build]
providers = ["nix"]

# Используем nixos-23.05 как стабильную версию Nixpkgs.
# Если эта версия вызовет проблемы, попробуйте "nixos-23.11.tar.gz" или "nixos-unstable.tar.gz".
pkgsArchive = "https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-23.05.tar.gz"

[nix.expression]
render = """
let
  # Импортируем Nixpkgs из указанного архива.
  pkgs = import pkgsArchive {};

  # Определяем пакет Node.js v20.
  # Убедитесь, что `pkgs.nodejs_20` существует в выбранной версии Nixpkgs.
  # Если нет, попробуйте `pkgs.nodejs.v20_2.full` или похожее имя.
  nodejsEnv = pkgs.nodejs_20;

  # Определяем пакет Chromium.
  # Мы будем использовать `pkgs.chromium` напрямую, чтобы избежать потенциальных проблем с переменной.
  chromiumPath = "${pkgs.chromium}/bin/chromium"; # Получаем путь к исполняемому файлу Chromium

in
pkgs.mkShell {
  packages = [
    nodejsEnv
    pkgs.chromium # Добавляем пакет Chromium
    # Добавляем системные библиотеки, которые часто нужны для Chromium.
    pkgs.libgbm
    pkgs.freetype
    pkgs.pango
    pkgs.libcups
    pkgs.libXrender
    pkgs.libXext
    pkgs.glibc
    pkgs.libnotify
  ];

  shellHook = ''
    echo "--- Nix Environment Setup ---"
    echo "Nixpkgs source: ${pkgsArchive}"
    
    # Используем 'which' для поиска исполняемых файлов после настройки PATH, это более надежно.
    # Переменные shell для более простой интерполяции в Nix.
    NODE_CMD='$(which node)'
    NPM_CMD='$(which npm)'
    CHROMIUM_EXEC="${chromiumPath}" # Используем заранее вычисленный путь

    echo "Node command: $NODE_CMD"
    echo "npm command: $NPM_CMD"
    echo "Chromium command: $CHROMIUM_EXEC"

    echo "---------------------------"

    # Экспортируем переменные окружения для Puppeteer.
    # Используем shell переменные для ясности.
    export CHROMIUM_PATH="$CHROMIUM_EXEC"
    export PUPPETEER_EXECUTABLE_PATH="$CHROMIUM_EXEC"

    # Обновляем PATH с исполняемыми файлами Node.js и npm.
    # Nix раскроет ${nodejsEnv.bin} и ${pkgs.npm.bin}.
    export PATH="${nodejsEnv.bin}:$PATH"
    export PATH="${pkgs.npm.bin}:$PATH"

    echo "PATH adjusted. Final node: $(which node), final npm: $(which npm)"
  '';
}
"""
# Команда для установки зависимостей проекта (выполняется до startCommand).
installCommand = "npm ci";

# Команда для запуска вашего приложения.
startCommand = """
echo "--- Application Startup ---"
echo "Using Node.js version: $(node --version)"
echo "Using npm version: $(npm --version)"
echo "Chromium path environment var: ${CHROMIUM_PATH}"
echo "Node executable path: $(which node)"
echo "---------------------------"

# Запускаем основной файл вашего приложения.
node server/index.js
"""